[project]
name = "neotec_order_costing"
authors = [{ name = "Neotec Integrated Solution", email = "support@neotec.ai" }]
description = "Order-wise COGS pegging, brand-wise procurement split, configurable batch naming and profitability reporting for ERP v15"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
